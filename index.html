<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Sirkel i firkant</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }

    .square {
      width: 200px;
      height: 200px;
      border: 3px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #4a90e2;
    }
  </style>
</head>
<body>
  <div class="square">
    <div class="circle"></div>
  </div>
</body>
</html>
